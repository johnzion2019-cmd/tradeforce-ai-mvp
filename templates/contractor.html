{% extends 'base.html' %}{% block title %}Post Manpower Request{% endblock %}{% block content %}<section class='formwrap'><h1>Post a Manpower Request</h1><form method='post'>
<label>Company<input name='company' required></label><label>Contact Name / Email / Phone<input name='contact'></label><label>Trade Needed<input name='trade' required placeholder='e.g. Pipefitter'></label><label>Workers Needed<input type='number' min='1' name='workers_needed' value='1'></label><label>Job Location<input name='location'></label><label>Start Date<input type='date' name='start_date'></label><label>Duration<input name='duration' placeholder='e.g. 6 weeks'></label><label>Pay Range<input name='pay_range' placeholder='$38–$45/hr + per diem'></label><label>Notes<textarea name='notes'></textarea></label><button class='btn'>Submit Request</button></form></section>{% endblock %}
