{% extends 'base.html' %}{% block title %}Post Manpower Request{% endblock %}{% block content %}<section class='formwrap'><h1>Request Skilled Manpower</h1><p class='muted'>Tell us what your project needs. TradeForce AI will rank available workers against your request.</p><form method='post'>
<label>Company<input name='company' required></label><label>Contact Name / Email / Phone<input name='contact'></label><label>Trade Needed<select name='trade' required><option>Pipefitter</option><option>Welder</option><option>Electrician</option><option>Millwright</option><option>Operator</option><option>Other</option></select></label><label>Workers Needed<input type='number' min='1' name='workers_needed' value='1'></label><label>Job Location<input name='location' placeholder='City, State'></label><label>Minimum Experience<input type='number' min='0' name='required_experience' value='0' placeholder='Years'></label><label>Start Date<input type='date' name='start_date'></label><label>Duration<input name='duration' placeholder='e.g. 6 weeks'></label><label>Pay Range<input name='pay_range' placeholder='$38–$45/hr + per diem'></label><label>Requirements / Notes<textarea name='notes' placeholder='Certifications, schedule, per diem, shift, project details...'></textarea></label><button class='btn'>Find Tradespeople</button></form></section>{% endblock %}
