{% extends 'base.html' %}{% block title %}Join TradeForce AI{% endblock %}{% block content %}<section class='formwrap'><h1>Build Your Tradesperson Profile</h1><p class='muted'>Tell TradeForce AI what you do, where you can work, and what opportunities fit you.</p><form method='post'>
<label>Name<input name='name' required></label><label>Trade<select name='trade' required><option>Pipefitter</option><option>Welder</option><option>Electrician</option><option>Millwright</option><option>Operator</option><option>Other</option></select></label><label>Home Location<input name='location' placeholder='City, State'></label><label>Years of Experience<input type='number' min='0' name='experience' value='0'></label><label>Desired Pay<input name='desired_pay' placeholder='e.g. $42/hr + per diem'></label><label>Travel Availability<select name='willing_to_travel'><option value='yes'>Yes — willing to travel</option><option value='no'>Local work only</option></select></label><label>Certifications<textarea name='certifications' placeholder='NCCER, OSHA 10, welding certs, TWIC, etc.'></textarea></label><label>Phone<input name='phone'></label><label>Email<input type='email' name='email'></label><button class='btn'>Join TradeForce AI</button></form></section>{% endblock %}
